<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>禮物盒</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <style>
    :root {
      --bg: #fbf6ee;
      --card: #ffffff;
      --text: #3b2f2a;
      --muted: #8a7b72;
      --accent: #e0795b;
      --accent-dark: #c4613f;
      --line: #eadfd3;
      --error: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 480px; margin: 0 auto; padding: 32px 20px 48px; }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 6px 24px rgba(120, 80, 50, 0.08);
    }
    h1 { font-size: 24px; margin: 0 0 6px; text-align: center; }
    .sub { color: var(--muted); text-align: center; margin: 0 0 24px; font-size: 15px; }
    .emoji { font-size: 48px; text-align: center; margin-bottom: 8px; }

    label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: 15px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      font-size: 16px; /* 16px 以上 iOS 才不會自動放大 */
      color: var(--text);
      background: #fffdfa;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 150px; resize: vertical; }
    .counter { text-align: right; color: var(--muted); font-size: 13px; margin-top: 4px; }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    button:active { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .error { color: var(--error); font-size: 14px; margin-top: 12px; text-align: center; min-height: 1em; }

    /* 進度 */
    .progress-num { text-align: center; font-size: 44px; font-weight: 800; color: var(--accent); margin: 8px 0 4px; }
    .progress-num small { font-size: 22px; color: var(--muted); font-weight: 600; }
    .bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 12px 0 20px; }
    .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s; }
    .names { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .names span { background: #fdeee7; color: var(--accent-dark); padding: 4px 12px; border-radius: 99px; font-size: 14px; }

    .center { text-align: center; }
    .loading { text-align: center; color: var(--muted); padding-top: 30vh; }
    /* ===== 禮物頁 ===== */
    #view-gift { padding-top: 8px; }
    .gift-hero { text-align: center; padding: 28px 8px 8px; animation: rise .8s ease both; }
    .gift-hero .big { font-size: 64px; line-height: 1; animation: pop 1s ease both; }
    .gift-hero h1 { font-size: 28px; margin: 16px 0 8px; }
    .gift-hero p { color: var(--muted); margin: 0; }

    .timeline { position: relative; margin: 32px 0 0; padding-left: 28px; }
    .timeline::before {
      content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px;
      width: 2px; background: linear-gradient(var(--accent), #f3c3ae);
      border-radius: 2px;
    }
    .year-group { position: relative; margin-bottom: 28px; opacity: 0; transform: translateY(16px); transition: opacity .7s, transform .7s; }
    .year-group.in { opacity: 1; transform: none; }
    .year-label {
      display: inline-block; font-weight: 800; font-size: 20px; color: var(--accent-dark);
      margin-bottom: 10px; position: relative;
    }
    .year-label::before {
      content: ""; position: absolute; left: -26px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--bg); border: 3px solid var(--accent);
    }
    .year-label small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }

    .wish {
      background: var(--card); border-radius: 16px; padding: 18px;
      box-shadow: 0 4px 16px rgba(120, 80, 50, 0.07); margin-bottom: 12px;
    }
    .wish-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .wish-head img, .wish-head .ph {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      background: #fdeee7; display: flex; align-items: center; justify-content: center;
      color: var(--accent-dark); font-weight: 700;
    }
    .wish-name { font-weight: 700; }
    .wish-msg { white-space: pre-wrap; word-break: break-word; margin: 0; }

    .gift-end { text-align: center; color: var(--accent-dark); font-weight: 700; font-size: 17px; padding: 24px 12px 8px; }

    .confetti { position: fixed; top: -12px; width: 8px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 9; animation: fall linear forwards; }

    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes pop  { 0% { transform: scale(.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    @media (prefers-reduced-motion: reduce) {
      .gift-hero, .gift-hero .big { animation: none; }
      .year-group { opacity: 1; transform: none; transition: none; }
      .confetti { display: none; }
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <!-- 載入中 -->
    <div id="view-loading" class="loading">載入中…</div>

    <!-- 錯誤 -->
    <div id="view-error" class="card center" hidden>
      <div class="emoji">😵</div>
      <h1>出了點問題</h1>
      <p class="sub" id="error-text"></p>
      <button onclick="location.reload()">重新整理</button>
    </div>

    <!-- 朋友：填寫表單 -->
    <div id="view-form" class="card" hidden>
      <div class="emoji">🎂</div>
      <h1>寫一段祝福給<span class="birthday-name"></span></h1>
      <p class="sub">為了開啟禮物盒，<span class="birthday-name"></span>需要至少 <span class="max"></span> 位朋友的祝福<br>目前已經有 <b id="form-count"></b> 位朋友送出了</p>

      <label for="nickname">你的暱稱 <span class="hint">（壽星平常怎麼叫你）</span></label>
      <input id="nickname" maxlength="20" placeholder="例如：Doris" />

      <label for="year">你們是哪一年認識的？</label>
      <select id="year"><option value="">請選擇年份</option></select>

      <label for="message">想對<span class="birthday-name"></span>說的話</label>
      <textarea id="message" maxlength="500" placeholder="寫下你的祝福…"></textarea>
      <div class="counter"><span id="msg-len">0</span> / 500</div>

      <button id="submit-btn">送出祝福</button>
      <div class="error" id="form-error"></div>
    </div>

    <!-- 朋友：已送出 -->
    <div id="view-thanks" class="card center" hidden>
      <div class="emoji">💌</div>
      <h1>謝謝你的祝福！</h1>
      <p class="sub">你的祝福已經收到了<br>收集到至少 <span class="max"></span> 份祝福後，<span class="birthday-name"></span>就能打開禮物</p>
    </div>

    <!-- 壽星：進度 -->
    <div id="view-owner" class="card" hidden>
      <div class="emoji">🎁</div>
      <h1 id="owner-title">生日禮物尚未解鎖</h1>
      <p class="sub" id="owner-sub">把連結分享給朋友，集滿祝福就能打開</p>
      <div class="progress-num"><span id="owner-count"></span><small> / <span class="max"></span></small></div>
      <div class="bar"><div id="owner-bar" style="width:0"></div></div>
      <div class="names" id="owner-names"></div>
      <button id="share-btn">分享連結給朋友</button>
      <button id="gift-btn" hidden>打開禮物 🎁</button>
    </div>

    <!-- 壽星：禮物頁 -->
    <div id="view-gift" hidden>
      <div class="gift-hero">
        <div class="big">🎂</div>
        <h1>生日快樂，<span class="birthday-name"></span>！</h1>
        <p id="gift-sub"></p>
        <p>領取禮物前，看看他們都寫些什麼吧</p>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="gift-end">
        現在，你可以截圖給始作俑者<br>兌換你的生日禮物 🎁
      </div>
    </div>
  </main>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ===== 設定區 =====
    const LIFF_ID       = "2011974729-yuI02QME";
    const GAS_URL       = "https://script.google.com/macros/s/AKfycbyYWlxWr_t3RRkcBmje0l1zHL2uomIBFFEhJudsHvLrsOB6kZoZBZbedXY_B8tQSzU/exec";
    const BIRTHDAY_NAME = "宏昇";   // 換成壽星的名字或綽號
    const YEAR_MIN = 1993;
    const YEAR_MAX = 2026;

    const ERROR_TEXT = {
      LOGIN_EXPIRED:       "登入逾時，請重新整理頁面",
      ALREADY_SUBMITTED:   "你已經送出過祝福囉",
      INVALID_NICKNAME:    "暱稱請填 1–20 個字",
      INVALID_MESSAGE:     "祝福請填 1–500 個字",
      INVALID_YEAR:        "請選擇認識的年份",
      OWNER_CANNOT_SUBMIT: "壽星不能幫自己寫祝福喔 😆",
      CONFIG_MISSING:      "後端設定不完整（指令碼屬性）",
      SERVER_ERROR:        "伺服器發生錯誤，請稍後再試",
    };

    const $ = (id) => document.getElementById(id);

    // ===== 呼叫後端 =====
    async function api(action, data = {}) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // 必須用 text/plain 避開 CORS
        body: JSON.stringify({ action, idToken: liff.getIDToken(), ...data }),
      });
      const json = await res.json();
      if (json.error === "LOGIN_EXPIRED") {
        // ID token 過期：登出後重新載入，LIFF 會自動重新登入
        liff.logout();
        location.reload();
        throw new Error("LOGIN_EXPIRED");
      }
      return json;
    }

    // ===== 切換畫面 =====
    function show(viewId) {
      document.querySelectorAll("main > div").forEach((el) => (el.hidden = el.id !== viewId));
    }
    function showError(code) {
      $("error-text").textContent = ERROR_TEXT[code] || code;
      show("view-error");
    }

    // ===== 主流程 =====
    async function main() {
      document.querySelectorAll(".birthday-name").forEach((el) => (el.textContent = BIRTHDAY_NAME));

      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const status = await api("status");
        if (!status.ok) return showError(status.error);

        document.querySelectorAll(".max").forEach((el) => (el.textContent = status.max));

        if (status.isOwner)        return renderOwner(status);
        if (status.submitted)      return show("view-thanks");
        renderForm(status);
      } catch (err) {
        console.error(err);
        if (err.message !== "LOGIN_EXPIRED") showError(err.message);
      }
    }

    // ===== 朋友：表單 =====
    async function renderForm(status) {
      $("form-count").textContent = status.count;

      // 年份選單：新的在上面
      const select = $("year");
      for (let y = YEAR_MAX; y >= YEAR_MIN; y--) select.add(new Option(y + " 年", y));

      // 暱稱預設帶入 LINE 名稱
      try {
        const profile = await liff.getProfile();
        $("nickname").value = profile.displayName.slice(0, 20);
      } catch (_) {}

      $("message").addEventListener("input", (e) => ($("msg-len").textContent = e.target.value.length));
      $("submit-btn").addEventListener("click", submitWish);
      show("view-form");
    }

    async function submitWish() {
      const nickname = $("nickname").value.trim();
      const year     = Number($("year").value);
      const message  = $("message").value.trim();
      const errorBox = $("form-error");
      const btn      = $("submit-btn");

      // 前端先檢查一次（後端還會再檢查）
      if (!nickname) return (errorBox.textContent = ERROR_TEXT.INVALID_NICKNAME);
      if (!year)     return (errorBox.textContent = ERROR_TEXT.INVALID_YEAR);
      if (!message)  return (errorBox.textContent = ERROR_TEXT.INVALID_MESSAGE);

      errorBox.textContent = "";
      btn.disabled = true;
      btn.textContent = "傳送中…";

      try {
        const result = await api("submit", { nickname, year, message });
        if (result.ok)                          return show("view-thanks");
        if (result.error === "ALREADY_SUBMITTED") return show("view-thanks");
        errorBox.textContent = ERROR_TEXT[result.error] || result.error;
      } catch (err) {
        errorBox.textContent = "網路不穩，請再試一次";
      }
      btn.disabled = false;
      btn.textContent = "送出祝福";
    }

    // ===== 壽星：進度 =====
    function renderOwner(status) {
      $("owner-count").textContent = status.count;
      $("owner-bar").style.width = Math.min(100, (status.count / status.max) * 100) + "%";

      const names = $("owner-names");
      status.names.forEach((n) => {
        const tag = document.createElement("span");
        tag.textContent = n;
        names.appendChild(tag);
      });

      // 達標後仍可繼續分享，讓更多朋友寫祝福
      $("share-btn").addEventListener("click", () => shareLink(status.max));
      if (status.unlocked) {
        $("owner-title").textContent = "生日禮物已解鎖！";
        $("owner-sub").textContent = "已經達標了！還沒寫的朋友之後仍然可以繼續寫";
        $("gift-btn").hidden = false;
        $("gift-btn").addEventListener("click", openGift);
      } else {
        $("owner-sub").textContent = `還差 ${status.max - status.count} 個人，把連結分享給朋友吧`;
      }
      show("view-owner");
    }

    async function shareLink(max) {
      const url = `https://liff.line.me/${LIFF_ID}`;
      const text = `我生日快到了 🎂 幫我寫一段祝福好嗎？至少要 ${max} 個人才能打開禮物！\n${url}`;
      try {
        if (liff.isApiAvailable("shareTargetPicker")) {
          await liff.shareTargetPicker([{ type: "text", text }]);
          return;
        }
      } catch (_) {}
      // 不支援分享選單時改成複製連結
      try {
        await navigator.clipboard.writeText(text);
        alert("已複製邀請文字，貼到聊天室就可以了");
      } catch (_) {
        prompt("複製以下文字分享給朋友：", text);
      }
    }

    // ===== 壽星：禮物頁 =====
    async function openGift() {
      const btn = $("gift-btn");
      btn.disabled = true;
      btn.textContent = "拆禮物中…";

      try {
        const result = await api("gift");
        if (!result.ok) {
          btn.disabled = false;
          btn.textContent = "打開禮物 🎁";
          return alert(result.error === "LOCKED" ? "還沒達標喔" : (ERROR_TEXT[result.error] || result.error));
        }
        renderGift(result.wishes);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "打開禮物 🎁";
        alert("網路不穩，請再試一次");
      }
    }

    function renderGift(wishes) {
      const thisYear = new Date().getFullYear();
      $("gift-sub").textContent = `果然是朋友王，總共收集了 ${wishes.length} 位朋友的祝福`;

      // 依年份分組（後端已經由舊到新排好）
      const groups = [];
      wishes.forEach((w) => {
        const last = groups[groups.length - 1];
        if (last && last.year === w.year) last.items.push(w);
        else groups.push({ year: w.year, items: [w] });
      });

      const timeline = $("timeline");
      timeline.innerHTML = "";
      groups.forEach((g) => {
        const group = document.createElement("section");
        group.className = "year-group";

        const label = document.createElement("div");
        label.className = "year-label";
        label.textContent = g.year;
        const ago = thisYear - g.year;
        const small = document.createElement("small");
        small.textContent = ago > 0 ? `認識 ${ago} 年` : "今年認識";
        label.appendChild(small);
        group.appendChild(label);

        g.items.forEach((w) => group.appendChild(wishCard(w)));
        timeline.appendChild(group);
      });

      show("view-gift");
      window.scrollTo(0, 0);
      confetti();
      revealOnScroll();
    }

    function wishCard(w) {
      const card = document.createElement("article");
      card.className = "wish";

      const head = document.createElement("div");
      head.className = "wish-head";
      if (w.picture) {
        const img = document.createElement("img");
        img.src = w.picture;
        img.alt = "";
        img.onerror = () => img.replaceWith(placeholder(w.nickname));
        head.appendChild(img);
      } else {
        head.appendChild(placeholder(w.nickname));
      }
      const name = document.createElement("div");
      name.className = "wish-name";
      name.textContent = w.nickname;
      head.appendChild(name);

      const msg = document.createElement("p");
      msg.className = "wish-msg";
      msg.textContent = w.message;

      card.append(head, msg);
      return card;
    }

    function placeholder(nickname) {
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = (nickname || "?").slice(0, 1);
      return ph;
    }

    // 滑到才淡入
    function revealOnScroll() {
      const groups = document.querySelectorAll(".year-group");
      if (!("IntersectionObserver" in window)) return groups.forEach((g) => g.classList.add("in"));
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.15 });
      groups.forEach((g) => io.observe(g));
    }

    // 灑彩紙
    function confetti() {
      const colors = ["#e0795b", "#f4b860", "#7fb7a4", "#f28fb1", "#8aa7e0"];
      for (let i = 0; i < 80; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = 2.5 + Math.random() * 2 + "s";
        c.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5500);
      }
    }

    main();
  </script>
</body>
</html>
