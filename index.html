<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日募集 - LIFF 測試</title>
  <style>
    body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; padding: 24px; line-height: 1.6; }
    img { width: 80px; height: 80px; border-radius: 50%; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h2>LIFF 連線測試</h2>
  <div id="status">初始化中…</div>
  <div id="profile" hidden>
    <img id="avatar" alt="大頭貼" />
    <p>暱稱：<span id="name"></span></p>
    <p>userId：<code id="uid"></code></p>
    <p>在 LINE 內開啟：<span id="inClient"></span></p>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2011974729-yuI02QME";

    async function main() {
      const status = document.getElementById("status");
      try {
        await liff.init({ liffId: LIFF_ID });

        // 在外部瀏覽器開啟時需要手動登入；在 LINE 內會自動登入
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        document.getElementById("avatar").src = profile.pictureUrl || "";
        document.getElementById("name").textContent = profile.displayName;
        document.getElementById("uid").textContent = profile.userId;
        document.getElementById("inClient").textContent = liff.isInClient() ? "是" : "否（外部瀏覽器）";

        // 之後送給後端驗證身分用的 ID token（這一步先確認拿得到）
        const idToken = liff.getIDToken();
        console.log("ID token 長度：", idToken ? idToken.length : "拿不到，請確認 scope 有勾 openid");

        status.textContent = "✅ 連線成功";
        document.getElementById("profile").hidden = false;
      } catch (err) {
        status.innerHTML = `<p class="error">❌ 初始化失敗：${err.message}</p>`;
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
