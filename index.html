<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>連線測試</title>
  <style>
    body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; padding: 24px; line-height: 1.6; }
    img { width: 80px; height: 80px; border-radius: 50%; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    pre { background: #f2f2f2; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h2>LIFF 連線測試</h2>
  <div id="status">初始化中…</div>
  <div id="profile" hidden>
    <img id="avatar" alt="大頭貼" />
    <p>暱稱：<span id="name"></span></p>
    <p>userId：<code id="uid"></code></p>
    <p>在 LINE 內開啟：<span id="inClient"></span></p>
    <h3>後端回應</h3>
    <pre id="backend"></pre>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2011974729-yuI02QME";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyYWlxWr_t3RRkcBmje0l1zHL2uomIBFFEhJudsHvLrsOB6kZoZBZbedXY_B8tQSzU/exec";

    async function main() {
      const status = document.getElementById("status");
      try {
        await liff.init({ liffId: LIFF_ID });

        // 在外部瀏覽器開啟時需要手動登入；在 LINE 內會自動登入
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        document.getElementById("avatar").src = profile.pictureUrl || "";
        document.getElementById("name").textContent = profile.displayName;
        document.getElementById("uid").textContent = profile.userId;
        document.getElementById("inClient").textContent = liff.isInClient() ? "是" : "否（外部瀏覽器）";

        status.textContent = "✅ LINE 連線成功";
        document.getElementById("profile").hidden = false;

        // 呼叫後端，測試身分驗證
        const backend = document.getElementById("backend");
        backend.textContent = "後端連線中…";
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // 必須用 text/plain 避開 CORS
          body: JSON.stringify({ action: "status", idToken: liff.getIDToken() }),
        });
        const data = await res.json();
        backend.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        status.innerHTML = `<p class="error">❌ 發生錯誤：${err.message}</p>`;
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
